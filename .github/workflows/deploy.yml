# Pocketknife CI/CD Pipeline
# Triggered on push to main branch
# Runs tests, linting, and deploys to cloud services

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Lint and Type Check
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Lint backend
        working-directory: backend
        run: npm run lint --if-present

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

      - name: Type check backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Type check frontend
        working-directory: frontend
        run: npx tsc --noEmit

  # ============================================
  # Test Suite
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run backend tests
        working-directory: backend
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:coverage

  # ============================================
  # Build Test
  # ============================================
  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install and build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ============================================
  # Deploy Backend to Railway
  # ============================================
  # NOTE: Railway deployment is handled automatically via Railway's GitHub integration.
  # Railway watches the 'main' branch and auto-deploys when tests pass.
  # 
  # To set up Railway auto-deploy:
  # 1. Go to Railway Dashboard → Your Project
  # 2. Click on the backend service
  # 3. Go to Settings → Source
  # 4. Connect to GitHub repo: osovlanski/pocketknife
  # 5. Set Root Directory: /backend
  # 6. Set Branch: main
  # 
  # This job just confirms the deploy is triggered.
  deploy-backend:
    name: Deploy Backend (Railway Auto-Deploy)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Railway deployment notification
        run: |
          echo "✅ Build passed! Railway will auto-deploy from the main branch."
          echo "📦 Backend deployment is handled by Railway's GitHub integration."
          echo "🔗 Check status at: https://railway.app/dashboard"

  # ============================================
  # Deploy Frontend to Vercel
  # ============================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Production
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ============================================
  # Database Migrations
  # ============================================
  # NOTE: Migrations run automatically in the Docker container on startup.
  # See backend/Dockerfile CMD which runs: npx prisma migrate deploy
  # 
  # This eliminates the need for DATABASE_URL in GitHub secrets.
  # If you prefer to run migrations in CI instead:
  # 1. Add DATABASE_URL to GitHub Secrets
  # 2. Uncomment the migrate job below
