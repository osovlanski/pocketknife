# Daily Automated Code Review with Claude
#
# This workflow runs Claude Code to perform a daily tech lead review
# of the codebase and creates a GitHub issue with the findings.
#
# Prerequisites:
# 1. Add ANTHROPIC_API_KEY to repository secrets
# 2. Ensure Claude Code is available (npm install @anthropic-ai/claude-code)
#
# Note: This is a template - Claude Code CLI availability may vary.
# Alternative: Use Anthropic API directly with a custom script.

name: Daily Code Review

on:
  schedule:
    # Run at 6 AM UTC every day (adjust timezone as needed)
    - cron: '0 6 * * *'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      focus_area:
        description: 'Focus area for review (e.g., security, performance, agents)'
        required: false
        default: 'general'

jobs:
  code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better context

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Get date for issue title
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Get changed files (last 24h)
        id: changed-files
        run: |
          # Get files changed in last 24 hours
          CHANGED=$(git log --since="24 hours ago" --name-only --pretty=format: | sort -u | head -50)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Code Review Script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOCUS_AREA: ${{ github.event.inputs.focus_area || 'general' }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          # Create review script
          cat > review-script.js << 'SCRIPT'
          const Anthropic = require('@anthropic-ai/sdk');
          const fs = require('fs');
          const path = require('path');

          async function runReview() {
            const client = new Anthropic();
            const focusArea = process.env.FOCUS_AREA || 'general';
            const changedFiles = process.env.CHANGED_FILES || '';

            // Read key files for context
            const keyFiles = [
              'ARCHITECTURE.md',
              'backend/src/agents/AbstractAgent.ts',
              'backend/vitest.config.ts',
              'package.json'
            ];

            let context = '';
            for (const file of keyFiles) {
              try {
                const content = fs.readFileSync(file, 'utf8');
                context += `\n--- ${file} ---\n${content.slice(0, 5000)}\n`;
              } catch (e) {
                // File might not exist
              }
            }

            const prompt = `You are a strict principal tech lead reviewing a codebase.

Focus Area: ${focusArea}
Recently Changed Files:
${changedFiles}

Key Files Context:
${context}

Provide a concise daily review focusing on:
1. Any critical issues that need immediate attention
2. Code quality concerns
3. Security vulnerabilities
4. Performance bottlenecks
5. Technical debt items

Format as markdown suitable for a GitHub issue.
Keep the review actionable and under 2000 words.`;

            const response = await client.messages.create({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 4096,
              messages: [{ role: 'user', content: prompt }]
            });

            const review = response.content[0].text;
            fs.writeFileSync('DAILY_REVIEW.md', review);
            console.log('Review completed');
          }

          runReview().catch(console.error);
          SCRIPT

          # Install Anthropic SDK and run review
          npm install @anthropic-ai/sdk
          node review-script.js

      - name: Create GitHub Issue
        uses: peter-evans/create-issue-from-file@v4
        env:
          REVIEW_DATE: ${{ steps.date.outputs.date }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          title: "Daily Code Review - ${{ env.REPO_NAME }} - ${{ env.REVIEW_DATE }}"
          content-filepath: DAILY_REVIEW.md
          labels: |
            automated-review
            tech-debt
            code-quality

      - name: Upload Review Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-review-${{ github.run_number }}
          path: DAILY_REVIEW.md
          retention-days: 30

  # Optional: Send notification to Slack/Discord
  notify:
    needs: code-review
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify on failure
        if: needs.code-review.result == 'failure'
        run: |
          echo "Code review workflow failed. Check GitHub Actions logs."
          # Add Slack/Discord webhook notification here if needed
