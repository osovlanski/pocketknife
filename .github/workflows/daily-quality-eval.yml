# Daily Quality Evaluation Workflow
#
# Runs automated evaluation of AI chat responses to track quality over time.
# All user inputs use environment variables for security.
#
# From: docs/plans/2026-02-02-ai-assistant-enhancements-design.md

name: Daily Quality Evaluation

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      question_count:
        description: 'Number of questions to evaluate'
        required: false
        type: string
        default: '20'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check required secrets
        id: check-secrets
        env:
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_ANTHROPIC_KEY" != "true" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not configured"
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_secrets=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.check-secrets.outputs.has_secrets == 'true'
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Prisma client
        if: steps.check-secrets.outputs.has_secrets == 'true'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate 2>&1 || echo "::warning::Prisma generate failed"

      - name: Run evaluation
        if: steps.check-secrets.outputs.has_secrets == 'true'
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QUESTION_COUNT: ${{ github.event.inputs.question_count }}
        run: |
          npm run evaluate:daily --if-present || node scripts/dailyEvaluation.js

      - name: Create skip report
        if: steps.check-secrets.outputs.has_secrets != 'true'
        run: |
          mkdir -p docs/quality-reports
          DATE_STR=$(date +%Y-%m-%d)
          cat > "docs/quality-reports/${DATE_STR}-skipped.md" << 'EOF'
          # Quality Evaluation Skipped

          Required secrets are not configured. Please add:
          - `ANTHROPIC_API_KEY` - Anthropic API key
          - `DATABASE_URL` - PostgreSQL connection string (optional)

          Go to Settings > Secrets and variables > Actions to configure.
          EOF

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/quality-reports/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: daily quality report $(date +%Y-%m-%d)"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.run_number }}
          path: docs/quality-reports/*.md
          retention-days: 30
          if-no-files-found: ignore
