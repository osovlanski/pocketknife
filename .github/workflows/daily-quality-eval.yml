# Daily Quality Evaluation Workflow
#
# Runs automated evaluation of AI chat responses to track quality over time.
# All user inputs use environment variables for security.
#
# From: docs/plans/2026-02-02-ai-assistant-enhancements-design.md

name: Daily Quality Evaluation

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      question_count:
        description: 'Number of questions to evaluate'
        required: false
        type: string
        default: '20'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run evaluation
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QUESTION_COUNT: ${{ github.event.inputs.question_count }}
        run: |
          npm run evaluate:daily --if-present || node scripts/dailyEvaluation.js

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/quality-reports/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: daily quality report $(date +%Y-%m-%d)"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.run_number }}
          path: docs/quality-reports/*.md
          retention-days: 30
          if-no-files-found: ignore
