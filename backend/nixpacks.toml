# Nixpacks configuration for Railway
# Alternative to Dockerfile - Railway auto-detects this

[phases.setup]
nixPkgs = ["nodejs-20_x"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "npm start"

[variables]
NODE_ENV = "production"

