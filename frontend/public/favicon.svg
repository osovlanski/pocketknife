<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3f81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>
  
  <!-- Pocketknife handle -->
  <rect x="20" y="35" width="45" height="30" rx="5" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Blade (extended) -->
  <path d="M 65 50 L 85 35 L 88 50 L 65 50" fill="url(#bladeGrad)" stroke="#64748b" stroke-width="1"/>
  
  <!-- Handle details (lines) -->
  <line x1="25" y1="42" x2="58" y2="42" stroke="#475569" stroke-width="1.5"/>
  <line x1="25" y1="50" x2="58" y2="50" stroke="#475569" stroke-width="1.5"/>
  <line x1="25" y1="58" x2="58" y2="58" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Pivot point -->
  <circle cx="62" cy="50" r="4" fill="#334155" stroke="#475569" stroke-width="1"/>
  <circle cx="62" cy="50" r="2" fill="#1e293b"/>
</svg>



