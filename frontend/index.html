<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pocketknife">
    <meta name="description" content="Your Personal AI Assistant Army - Seven specialized AI agents working together to automate your tasks">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Pocketknife</title>
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/icons/icon.svg">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon.svg">
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon.svg">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Vanta.js Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    
    <style>
        /* Ensure the vanta background covers the full page */
        #vanta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        /* Ensure content is above the background */
        #root {
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <!-- Vanta.js animated background -->
    <div id="vanta-bg"></div>
    
    <!-- React app root -->
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Initialize Vanta.js after DOM is ready -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Vanta.js (reduce points on mobile for performance)
            if (typeof VANTA !== 'undefined') {
                const isMobile = window.innerWidth < 768;
                VANTA.NET({
                    el: "#vanta-bg",
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.00,
                    minWidth: 200.00,
                    scale: 1.00,
                    scaleMobile: 0.75,
                    color: 0xff3f81,
                    backgroundColor: 0x23153c,
                    points: isMobile ? 6 : 10,
                    maxDistance: isMobile ? 15 : 20,
                    spacing: isMobile ? 18 : 15,
                    showDots: true
                });
            }
        });
        
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('SW registered:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('SW registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
